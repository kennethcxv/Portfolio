<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Machine learning explained on a chalkboard">
  <rect width="1200" height="675" fill="#1d3b2a"/>
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#8a5a2b" stroke-width="24"/>

  <!-- Chalk title, hand-drawn underline -->
  <text x="600" y="110" font-family="Comic Sans MS, Segoe UI, cursive" font-size="44" fill="#f1f5e9" text-anchor="middle">What&#8217;s inside the black box?</text>
  <path d="M 320 132 q 140 14 280 2 q 140 -10 280 4" fill="none" stroke="#f1f5e9" stroke-width="3" opacity="0.7"/>

  <!-- Chalk diagram: inputs, box with tree, output -->
  <g font-family="Comic Sans MS, Segoe UI, cursive" font-size="24" fill="#93c5fd">
    <text x="120" y="280">emails</text>
    <text x="120" y="350">photos</text>
    <text x="120" y="420">clicks</text>
  </g>
  <g stroke="#f1f5e9" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M 230 272 q 60 6 110 34"/>
    <path d="M 230 342 q 60 2 110 4"/>
    <path d="M 230 412 q 60 -6 110 -34"/>
  </g>

  <!-- dashed box (opened) -->
  <rect x="360" y="220" width="330" height="240" fill="none" stroke="#f9a8d4" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="380" y="205" font-family="Comic Sans MS, Segoe UI, cursive" font-size="20" fill="#f9a8d4">not magic! just math</text>

  <!-- chalk decision tree -->
  <g stroke="#f1f5e9" stroke-width="2.5" fill="none">
    <path d="M 525 270 q -30 40 -60 70"/>
    <path d="M 525 270 q 30 40 60 70"/>
    <path d="M 465 340 q -15 35 -25 60"/>
    <path d="M 465 340 q 20 35 30 60"/>
    <path d="M 585 340 q 15 35 25 60"/>
  </g>
  <g fill="none" stroke="#f9a8d4" stroke-width="3">
    <circle cx="525" cy="265" r="16"/>
  </g>
  <g fill="none" stroke="#f1f5e9" stroke-width="2.5">
    <circle cx="465" cy="340" r="13"/><circle cx="585" cy="340" r="13"/>
    <circle cx="440" cy="410" r="10"/><circle cx="497" cy="410" r="10"/><circle cx="610" cy="410" r="10"/>
  </g>

  <path d="M 690 340 q 60 0 110 0" fill="none" stroke="#f1f5e9" stroke-width="2.5"/>
  <path d="M 785 332 l 16 8 l -16 8" fill="none" stroke="#f1f5e9" stroke-width="2.5"/>

  <g font-family="Comic Sans MS, Segoe UI, cursive">
    <text x="825" y="330" font-size="26" fill="#fcd34d">&#8220;spam? no&#8221;</text>
    <text x="835" y="365" font-size="19" fill="#93c5fd">(97% sure)</text>
  </g>

  <!-- Chalk footnotes -->
  <g font-family="Comic Sans MS, Segoe UI, cursive" font-size="21">
    <text x="130" y="545" fill="#f1f5e9">1. supervised = learns from answer keys</text>
    <text x="130" y="585" fill="#f1f5e9" opacity="0.85">2. unsupervised = finds its own groups</text>
    <text x="700" y="545" fill="#f1f5e9" opacity="0.7">3. reinforcement = trial &amp; error</text>
    <text x="700" y="585" fill="#fcd34d">quiz friday &#9786;</text>
  </g>
  <!-- eraser smudge -->
  <ellipse cx="1030" cy="450" rx="70" ry="18" fill="#f1f5e9" opacity="0.06"/>
</svg>
