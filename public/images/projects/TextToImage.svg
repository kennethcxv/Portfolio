<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Text to image generator">
  <defs>
    <linearGradient id="tti-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#170b26"/>
  <circle cx="600" cy="700" r="420" fill="#22103a"/>

  <!-- Command-palette prompt, centered -->
  <g>
    <rect x="230" y="70" width="740" height="72" rx="36" fill="#211136" stroke="url(#tti-glow)" stroke-width="2.5"/>
    <circle cx="278" cy="106" r="14" fill="none" stroke="#f472b6" stroke-width="3"/>
    <line x1="288" y1="116" x2="302" y2="130" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <text x="330" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#ede4fb">a lighthouse at dusk, gouache on paper</text>
  </g>
  <text x="600" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8d7ba8" text-anchor="middle">type it, watch it appear</text>

  <!-- Cascade: noise → shape → image, stepped diagonally -->
  <g>
    <rect x="150" y="240" width="250" height="250" rx="16" fill="#211136" stroke="#3a2455" stroke-width="2"/>
    <g fill="#5d4a7a">
      <circle cx="190" cy="280" r="4"/><circle cx="240" cy="295" r="3"/><circle cx="295" cy="272" r="4"/>
      <circle cx="350" cy="290" r="3"/><circle cx="205" cy="335" r="3"/><circle cx="270" cy="348" r="4"/>
      <circle cx="335" cy="330" r="3"/><circle cx="185" cy="385" r="4"/><circle cx="250" cy="400" r="3"/>
      <circle cx="315" cy="382" r="4"/><circle cx="370" cy="410" r="3"/><circle cx="200" cy="440" r="3"/>
      <circle cx="265" cy="452" r="4"/><circle cx="330" cy="435" r="3"/><circle cx="365" cy="465" r="4"/>
    </g>
    <text x="170" y="520" font-family="Consolas, monospace" font-size="16" fill="#5d4a7a">step 0 &#183; noise</text>
  </g>

  <g>
    <rect x="455" y="290" width="250" height="250" rx="16" fill="#211136" stroke="#3a2455" stroke-width="2"/>
    <polygon points="555,510 578,350 601,510" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="578" cy="330" r="10" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="4 4"/>
    <g fill="#5d4a7a">
      <circle cx="490" cy="330" r="3"/><circle cx="665" cy="320" r="4"/><circle cx="500" cy="470" r="4"/><circle cx="670" cy="480" r="3"/>
    </g>
    <text x="475" y="570" font-family="Consolas, monospace" font-size="16" fill="#8d7ba8">step 25 &#183; form</text>
  </g>

  <g>
    <rect x="760" y="340" width="250" height="250" rx="16" fill="#2a1740" stroke="url(#tti-glow)" stroke-width="3"/>
    <rect x="760" y="510" width="250" height="80" rx="0" fill="#22103a"/>
    <line x1="760" y1="510" x2="1010" y2="510" stroke="#f472b6" stroke-width="2.5"/>
    <polygon points="860,510 882,390 904,510" fill="#170b26" stroke="#ede4fb" stroke-width="3"/>
    <rect x="868" y="408" width="28" height="14" fill="#fbbf24"/>
    <circle cx="882" cy="382" r="8" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round">
      <line x1="856" y1="374" x2="832" y2="362"/>
      <line x1="908" y1="374" x2="932" y2="362"/>
    </g>
    <circle cx="965" cy="385" r="17" fill="none" stroke="#f472b6" stroke-width="2.5"/>
    <text x="782" y="620" font-family="Consolas, monospace" font-size="16" fill="#f472b6">step 50 &#183; done &#10003;</text>
  </g>

  <!-- connecting dots -->
  <g fill="url(#tti-glow)">
    <circle cx="420" cy="390" r="5"/><circle cx="437" cy="405" r="4"/>
    <circle cx="723" cy="440" r="5"/><circle cx="741" cy="455" r="4"/>
  </g>
</svg>
