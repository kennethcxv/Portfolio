<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Semantic code search as sonar">
  <rect width="1200" height="675" fill="#050e1f"/>
  <!-- depth gradient bands -->
  <rect x="0" y="0" width="1200" height="225" fill="#081831" opacity="0.8"/>
  <rect x="0" y="0" width="1200" height="110" fill="#0b2145" opacity="0.8"/>

  <text x="70" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#dbeafe">Search that gets the idea</text>
  <text x="70" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#5c7ba6">ask in English, find the function &#183; BM25 + embeddings over 500k lines</text>

  <!-- Sonar query, upper left -->
  <g>
    <rect x="70" y="170" width="620" height="62" rx="31" fill="#0b2145" stroke="#4c9aff" stroke-width="2.5"/>
    <circle cx="112" cy="201" r="13" fill="none" stroke="#4c9aff" stroke-width="3"/>
    <line x1="121" y1="211" x2="134" y2="224" stroke="#4c9aff" stroke-width="3" stroke-linecap="round"/>
    <text x="158" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#dbeafe">where do we retry failed payment webhooks?</text>
  </g>
  <!-- sonar pings radiating down -->
  <g fill="none" stroke="#4c9aff">
    <path d="M 380 250 a 240 240 0 0 0 240 210" stroke-width="2" opacity="0.5"/>
    <path d="M 380 250 a 340 340 0 0 0 330 300" stroke-width="1.5" opacity="0.3"/>
    <path d="M 380 250 a 140 140 0 0 0 150 120" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Results as sonar contacts at depth -->
  <g font-family="Consolas, ui-monospace, monospace">
    <!-- strongest contact -->
    <g>
      <circle cx="640" cy="420" r="34" fill="#ff7a59" opacity="0.18"/>
      <circle cx="640" cy="420" r="20" fill="#ff7a59" opacity="0.35"/>
      <circle cx="640" cy="420" r="9" fill="#ff7a59"/>
      <line x1="668" y1="420" x2="740" y2="420" stroke="#ff7a59" stroke-width="2"/>
      <text x="750" y="412" font-size="20" fill="#ffd9cd">payments/webhook_retry.py</text>
      <text x="750" y="436" font-size="16" fill="#8aa3c4">retry_failed_webhook(event, backoff=exp)</text>
      <text x="750" y="460" font-size="16" fill="#ff7a59">match 0.94</text>
    </g>
    <g>
      <circle cx="500" cy="530" r="7" fill="#4c9aff"/>
      <circle cx="500" cy="530" r="15" fill="#4c9aff" opacity="0.3"/>
      <line x1="522" y1="530" x2="580" y2="530" stroke="#4c9aff" stroke-width="2"/>
      <text x="590" y="524" font-size="18" fill="#bcd7ff">billing/tasks/reconcile.py</text>
      <text x="590" y="546" font-size="15" fill="#5c7ba6">match 0.81</text>
    </g>
    <g>
      <circle cx="330" cy="470" r="6" fill="#4c9aff" opacity="0.8"/>
      <circle cx="330" cy="470" r="13" fill="#4c9aff" opacity="0.25"/>
      <line x1="350" y1="470" x2="400" y2="470" stroke="#4c9aff" stroke-width="2" opacity="0.8"/>
      <text x="410" y="464" font-size="18" fill="#bcd7ff" opacity="0.9">core/http/backoff.go</text>
      <text x="410" y="486" font-size="15" fill="#5c7ba6">match 0.77</text>
    </g>
  </g>

  <!-- Depth ruler, right edge -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="14" fill="#39567e">
    <line x1="1130" y1="160" x2="1130" y2="640" stroke="#1b3252" stroke-width="2"/>
    <line x1="1122" y1="240" x2="1138" y2="240" stroke="#39567e" stroke-width="2"/>
    <text x="1096" y="245">.90</text>
    <line x1="1122" y1="400" x2="1138" y2="400" stroke="#39567e" stroke-width="2"/>
    <text x="1096" y="405">.80</text>
    <line x1="1122" y1="560" x2="1138" y2="560" stroke="#39567e" stroke-width="2"/>
    <text x="1096" y="565">.70</text>
  </g>

  <!-- Bottom: instrumentation -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="17">
    <rect x="70" y="600" width="1000" height="2" fill="#1b3252"/>
    <text x="70" y="640" fill="#5c7ba6">Redis cache: p95 &#8595;35%</text>
    <text x="420" y="640" fill="#5c7ba6">irrelevant top-k: &#8595;40%</text>
    <text x="760" y="640" fill="#5c7ba6">scored on recall@k + MRR</text>
  </g>
</svg>
