<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Face authentication scanner">
  <rect width="1200" height="675" fill="#05171c"/>
  <g stroke="#0d2a33" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/><line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/><line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Vertical label, left edge -->
  <text x="60" y="580" font-family="Consolas, ui-monospace, monospace" font-size="30" font-weight="700" fill="#22d3ee" transform="rotate(-90 60 580)" letter-spacing="8">AI&#8201;AUTHENTICATOR</text>

  <!-- Scanner frame, centered -->
  <g stroke="#22d3ee" stroke-width="4" fill="none">
    <path d="M 420 120 h 70 M 420 120 v 70"/>
    <path d="M 780 120 h -70 M 780 120 v 70"/>
    <path d="M 420 540 h 70 M 420 540 v -70"/>
    <path d="M 780 540 h -70 M 780 540 v -70"/>
  </g>
  <ellipse cx="600" cy="330" rx="105" ry="130" fill="none" stroke="#9fe8f5" stroke-width="2.5" opacity="0.9"/>
  <g fill="#22d3ee">
    <circle cx="560" cy="290" r="6"/><circle cx="640" cy="290" r="6"/>
    <circle cx="600" cy="345" r="6"/>
    <circle cx="565" cy="400" r="6"/><circle cx="635" cy="400" r="6"/><circle cx="600" cy="402" r="6"/>
  </g>
  <!-- mesh lines between landmarks -->
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.5">
    <line x1="560" y1="290" x2="640" y2="290"/><line x1="560" y1="290" x2="600" y2="345"/>
    <line x1="640" y1="290" x2="600" y2="345"/><line x1="600" y1="345" x2="565" y2="400"/>
    <line x1="600" y1="345" x2="635" y2="400"/><line x1="565" y1="400" x2="635" y2="400"/>
  </g>
  <!-- scan line -->
  <rect x="430" y="316" width="340" height="26" fill="#22d3ee" opacity="0.15"/>
  <line x1="430" y1="329" x2="770" y2="329" stroke="#22d3ee" stroke-width="2"/>

  <!-- Readout column, right -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="19">
    <text x="850" y="180" fill="#3d6b78">embedding &#8477;&#185;&#178;&#8320;</text>
    <text x="850" y="212" fill="#9fe8f5">[0.12 -0.87 0.44</text>
    <text x="850" y="240" fill="#9fe8f5"> 0.03  0.61 ...]</text>
    <text x="850" y="300" fill="#3d6b78">cosine match</text>
    <text x="850" y="336" fill="#9fe8f5" font-size="30" font-weight="700">0.97</text>
    <text x="850" y="392" fill="#3d6b78">liveness</text>
    <text x="850" y="424" fill="#9fe8f5">blink ok &#183; depth ok</text>
  </g>

  <!-- Verdict bar -->
  <rect x="420" y="590" width="360" height="54" rx="27" fill="#a3e635"/>
  <text x="600" y="625" font-family="Consolas, ui-monospace, monospace" font-size="24" font-weight="700" fill="#05171c" text-anchor="middle">ACCESS GRANTED</text>
</svg>
