<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Distributed key-value store diagram">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <text x="70" y="110" font-family="ui-monospace, Consolas, monospace" font-size="52" font-weight="700" fill="#ffffff">DISTRIBUTED KV STORE</text>
  <text x="70" y="160" font-family="ui-monospace, Consolas, monospace" font-size="26" fill="#9ca3af">Raft consensus &#183; Go &#183; RocksDB &#183; Docker</text>

  <!-- Cluster: leader + 4 followers -->
  <g stroke="#58E6D9" stroke-width="2" opacity="0.55">
    <line x1="600" y1="330" x2="380" y2="470"/>
    <line x1="600" y1="330" x2="820" y2="470"/>
    <line x1="600" y1="330" x2="470" y2="580"/>
    <line x1="600" y1="330" x2="730" y2="580"/>
  </g>

  <g>
    <circle cx="600" cy="330" r="58" fill="#B63E96"/>
    <text x="600" y="324" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">LEADER</text>
    <text x="600" y="350" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#ffffff" text-anchor="middle">term 7</text>
  </g>

  <g fill="#111111" stroke="#58E6D9" stroke-width="2.5">
    <circle cx="380" cy="470" r="44"/>
    <circle cx="820" cy="470" r="44"/>
    <circle cx="470" cy="580" r="44"/>
    <circle cx="730" cy="580" r="44"/>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#58E6D9" text-anchor="middle">
    <text x="380" y="476">node-2</text>
    <text x="820" y="476">node-3</text>
    <text x="470" y="586">node-4</text>
    <text x="730" y="586">node-5</text>
  </g>

  <!-- Replicated log -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="18">
    <text x="880" y="250" fill="#9ca3af">replicated log</text>
    <g>
      <rect x="880" y="270" width="34" height="34" fill="#58E6D9" opacity="0.9"/>
      <rect x="920" y="270" width="34" height="34" fill="#58E6D9" opacity="0.9"/>
      <rect x="960" y="270" width="34" height="34" fill="#58E6D9" opacity="0.9"/>
      <rect x="1000" y="270" width="34" height="34" fill="#B63E96"/>
      <rect x="1040" y="270" width="34" height="34" fill="none" stroke="#4b5563" stroke-dasharray="4 4"/>
    </g>
    <text x="880" y="340" fill="#4ade80">SET user:42 &#8594; committed</text>
  </g>

  <!-- Stats chips -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="600">
    <rect x="70" y="560" rx="20" width="270" height="44" fill="none" stroke="#B63E96" stroke-width="2"/>
    <text x="205" y="589" fill="#ffffff" text-anchor="middle">~10k writes/sec</text>
    <rect x="70" y="500" rx="20" width="270" height="44" fill="none" stroke="#58E6D9" stroke-width="2"/>
    <text x="205" y="529" fill="#ffffff" text-anchor="middle">1M+ entries</text>
  </g>
</svg>
