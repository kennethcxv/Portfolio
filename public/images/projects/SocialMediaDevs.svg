<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Developer social network">
  <rect width="1200" height="675" fill="#0d1117"/>

  <!-- Terminal-prompt header -->
  <text x="60" y="80" font-family="Consolas, ui-monospace, monospace" font-size="26" fill="#3fb950">~/dev-social $</text>
  <text x="290" y="80" font-family="Consolas, ui-monospace, monospace" font-size="26" fill="#e6edf3">where programmers argue in public</text>
  <rect x="815" y="60" width="14" height="26" fill="#3fb950">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Post card -->
  <g font-family="Consolas, ui-monospace, monospace">
    <rect x="60" y="130" width="640" height="420" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="110" cy="180" r="20" fill="#1f6feb"/>
    <text x="102" y="188" font-size="20" fill="#ffffff">r</text>
    <text x="145" y="176" font-size="20" fill="#e6edf3" font-weight="700">rosa_dev</text>
    <text x="270" y="176" font-size="17" fill="#7d8590">posted 2h ago</text>
    <text x="145" y="200" font-size="17" fill="#7d8590">debounce in one closure, fight me</text>

    <rect x="90" y="225" width="580" height="200" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="115" y="262" font-size="19"><tspan fill="#ff7b72">const</tspan><tspan fill="#79c0ff"> debounce</tspan><tspan fill="#e6edf3"> = (fn, ms) =&gt; {</tspan></text>
    <text x="140" y="292" font-size="19" fill="#e6edf3">let t;</text>
    <text x="140" y="322" font-size="19"><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3"> (...a) =&gt; {</tspan></text>
    <text x="165" y="352" font-size="19" fill="#e6edf3">clearTimeout(t);</text>
    <text x="165" y="382" font-size="19" fill="#e6edf3">t = setTimeout(() =&gt; fn(...a), ms);</text>
    <text x="140" y="412" font-size="19" fill="#e6edf3">};  <tspan fill="#7d8590">// that&#8217;s it</tspan></text>

    <g font-size="19">
      <path d="M 100 500 l 13 -20 l 13 20 z" fill="#3fb950"/>
      <text x="135" y="503" fill="#3fb950" font-weight="700">148</text>
      <path d="M 205 483 l 13 20 l 13 -20 z" fill="#484f58"/>
      <text x="240" y="503" fill="#7d8590">3</text>
      <text x="310" y="503" fill="#79c0ff">12 replies</text>
      <text x="460" y="503" fill="#7d8590">&#8853; save</text>
    </g>
  </g>

  <!-- Replies rail -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="17">
    <line x1="770" y1="150" x2="770" y2="560" stroke="#30363d" stroke-width="2"/>
    <circle cx="770" cy="185" r="6" fill="#3fb950"/>
    <rect x="795" y="158" width="345" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="815" y="182" fill="#79c0ff">tomas</text>
    <text x="815" y="204" fill="#c9d1d9">cleaner than lodash tbh</text>

    <circle cx="770" cy="275" r="6" fill="#d29922"/>
    <rect x="795" y="248" width="345" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="815" y="272" fill="#79c0ff">nina.c</text>
    <text x="815" y="294" fill="#c9d1d9">what about leading edge?</text>

    <circle cx="770" cy="365" r="6" fill="#f85149"/>
    <rect x="795" y="338" width="345" height="56" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="815" y="362" fill="#79c0ff">rosa_dev</text>
    <text x="815" y="384" fill="#c9d1d9">PR&#8217;d a flag for it. happy?</text>

    <circle cx="770" cy="455" r="6" fill="#3fb950"/>
    <rect x="795" y="428" width="345" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="815" y="452" fill="#79c0ff">nina.c</text>
    <text x="815" y="474" fill="#c9d1d9">extremely. upvoted</text>
  </g>

  <!-- Status footer -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="17" fill="#7d8590">
    <text x="60" y="620">votes decide what rises &#183; syntax highlighting built in</text>
  </g>
</svg>
