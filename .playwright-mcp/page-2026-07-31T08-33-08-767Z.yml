              - img "Semantic Code Search Engine" [ref=e205]
            - generic [ref=e206]:
              - generic [ref=e207]: AI / Search | Python · FastAPI · pgvector · Redis
              - link [ref=e208] [cursor=pointer]:
                - /url: https://github.com/kennethcxv
                - heading "Semantic Code Search Engine" [level=2] [ref=e209]
              - paragraph [ref=e210]: Search that understands what code does instead of just matching names. It blends BM25 keyword retrieval with embeddings stored in Postgres through pgvector, which cut irrelevant top results by 40% compared to a vector-only baseline on a query set I labeled by hand. There is an offline harness that scores recall@k and MRR so I can tell if a change actually helped, and a Redis cache that keeps p95 latency 35% lower under load. It indexes a 500k-line codebase.
