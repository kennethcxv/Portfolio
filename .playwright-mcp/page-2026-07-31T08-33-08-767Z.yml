              - link [ref=e48] [cursor=pointer]:
                - /url: https://github.com/kennethcxv
                - heading "Distributed Key-Value Store (Raft)" [level=2] [ref=e49]
              - paragraph [ref=e50]: I wrote the Raft consensus protocol from scratch in Go, then built a key-value store on top of it. Five nodes elect a leader, replicate a log, and recover cleanly from crashes. I threw simulated network partitions at it with over a million entries loaded and it kept strong consistency the whole time. Storage runs on RocksDB with MVCC versioning, writes clock in around 10k per second, and Prometheus tracks throughput and p99 latency. Each node ships in its own Docker container.
