                - heading "Distributed Job Queue" [level=2] [ref=e129]
              - paragraph [ref=e130]: A job queue in Go that spreads work across five worker nodes and chews through about 10k tasks an hour. Jobs carry priorities, a token bucket keeps anyone from flooding the queue, and work that keeps failing lands in a dead-letter queue instead of silently disappearing. Prometheus and Grafana watch queue depth, latency, and failure rates, and I wrote runbooks for the alerts that actually matter, like workers getting stuck.
